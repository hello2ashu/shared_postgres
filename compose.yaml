# NEW STACK — replaces the standalone "postgres" service in the Linkwarden/Karakeep
# stack, the standalone "db" service in the AirTrail stack, and the standalone "db"
# service in the Docmost stack. None of these three need a Postgres extension, so
# they can safely share one plain instance.
#
# Also hosts shared_redis, which replaces Dawarich's and Docmost's separate Redis
# containers. They're isolated from each other via Redis's logical DB index (not a
# separate instance): Dawarich uses DB 0, Docmost uses DB 1. See deploy-dawarich.yaml
# and deploy-docmost.yaml for the REDIS_URL values that select those.
#
# SETUP (if this stack has NOT been deployed yet):
# 1. Create /volume1/docker/shared-postgres/init/init.sql (Postgres only runs files in
#    this folder on a completely fresh, empty data directory) with:
#
#      CREATE USER linkwardenuser WITH PASSWORD 'REPLACE_ME';
#      CREATE DATABASE linkwarden OWNER linkwardenuser;
#
#      CREATE USER airtrailuser WITH PASSWORD 'REPLACE_ME';
#      CREATE DATABASE airtrail OWNER airtrailuser;
#
#      CREATE USER docmostuser WITH PASSWORD 'REPLACE_ME';
#      CREATE DATABASE docmost OWNER docmostuser;
#
# 2. Deploy this stack, confirm all three DBs/users were created (docker exec -it
#    Shared-Postgres psql -U postgres -c "\l").
#
# SETUP (if this stack is ALREADY running with linkwarden/airtrail/docmost migrated) —
# init.sql will NOT re-run automatically since the data directory isn't fresh anymore,
# but shared_redis is a brand new service, so a plain `docker compose up -d` on this
# file will add it alongside the running shared_postgres without touching it.
#
# 3. Postgres: migrate data with pg_dump from each old DB container, pg_restore into
#    this one (see prior instructions for the exact commands per app).
#    Redis: no data migration needed — see the Redis cutover steps provided separately.
# 4. Then deploy the updated linkwarden/airtrail/docmost/dawarich stacks and remove the
#    old "postgres"/"db"/"redis" services and volumes once you've confirmed data is intact.

services:
  shared_postgres:
    image: postgres:17-alpine
    container_name: Shared-Postgres
    hostname: shared_postgres
    environment:
      # Only used to create the superuser; app databases/users come from init.sql
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${sharedpgadminpass}
      TZ: America/Los_Angeles
    volumes:
      - /volume1/docker/shared-postgres/data:/var/lib/postgresql/data:rw
      - /volume1/docker/shared-postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    restart: on-failure:5

  shared_redis:
    image: redis:8.10.1-alpine
    container_name: Shared-Redis
    hostname: shared_redis
    command: redis-server
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: 1026:100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    volumes:
      - /volume1/docker/shared-redis/data:/data:rw
    environment:
      TZ: America/Los_Angeles
    mem_limit: 384m   # combined Dawarich (256m) + Docmost (256m) allowances, trimmed since
                      # actual Redis usage for both is far below that ceiling in practice
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    restart: on-failure:5

networks:
  default:
    name: shared-postgres_net
