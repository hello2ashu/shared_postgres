# NEW STACK — replaces the standalone "postgres" service in the Linkwarden/Karakeep
# stack, the standalone "db" service in the AirTrail stack, and the standalone "db"
# service in the Docmost stack. None of these three need a Postgres extension, so
# they can safely share one plain instance.
#
# SETUP (if this stack has NOT been deployed yet):
# 1. Create /volume1/docker/shared-postgres/init/init.sql (Postgres only runs files in
#    this folder on a completely fresh, empty data directory) with:
#
#      CREATE USER linkwardenuser WITH PASSWORD 'REPLACE_ME';
#      CREATE DATABASE linkwarden OWNER linkwardenuser;
#
#      CREATE USER airtrailuser WITH PASSWORD 'REPLACE_ME';
#      CREATE DATABASE airtrail OWNER airtrailuser;
#
#      CREATE USER docmostuser WITH PASSWORD 'REPLACE_ME';
#      CREATE DATABASE docmost OWNER docmostuser;
#
# 2. Deploy this stack, confirm all three DBs/users were created (docker exec -it
#    Shared-Postgres psql -U postgres -c "\l").
#
# SETUP (if this stack is ALREADY running with linkwarden/airtrail migrated) —
# init.sql will NOT re-run automatically since the data directory isn't fresh anymore.
# Just run the docmost lines directly instead:
#
#   docker exec -it Shared-Postgres psql -U postgres -c \
#     "CREATE USER docmostuser WITH PASSWORD 'REPLACE_ME';"
#   docker exec -it Shared-Postgres psql -U postgres -c \
#     "CREATE DATABASE docmost OWNER docmostuser;"
#
# (Still worth adding the same lines to init.sql for documentation / disaster-recovery
# rebuilds, even though they won't execute again on this running instance.)
#
# 3. Migrate data: pg_dump from each old DB container, pg_restore into this one.
# 4. Then deploy the updated linkwarden/airtrail/docmost stacks and remove the old
#    "postgres" / "db" services and their volumes once you've confirmed data is intact.

services:
  shared_postgres:
    image: postgres:17-alpine
    container_name: Shared-Postgres
    hostname: shared_postgres
    environment:
      # Only used to create the superuser; app databases/users come from init.sql
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${sharedpgadminpass}
      TZ: America/Los_Angeles
    volumes:
      - /volume1/docker/shared-postgres/data:/var/lib/postgresql/data:rw
      - /volume1/docker/shared-postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    restart: on-failure:5

networks:
  default:
    name: shared-postgres_net
